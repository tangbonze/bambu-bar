name: build

# 三平台产物：macOS（arm64 + x64）、Windows（msi/nsis）、Linux（AppImage/deb）。
# 手动触发即可，避免每次提交都跑一遍完整打包（首次编译约 6~8 分钟）。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
            rust: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app
          - os: macos-14
            name: macos-x64
            rust: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app
          - os: windows-latest
            name: windows
            rust: ""
            args: --bundles nsis
          - os: ubuntu-22.04
            name: linux
            rust: ""
            args: --bundles appimage,deb

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Node 20 不认 node --test 的 glob 写法（会当成字面路径），22 才认。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Linux 的托盘是 AppIndicator，WebView 是 WebKitGTK —— 不装这两组依赖
      # 编译能过但运行起来既没有图标也没有界面。
      - name: Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2

      # macos-13 runner 已下线，x64 也在 macos-14（arm64 主机）上交叉编译，
      # 所以 target 不能按 os 猜，得由 matrix 显式给。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci || npm install
      - run: npm run build:ui

      # 视图模型那层是纯 JS（报文 → 视图），跟 Rust 各自一套单测，都跑一遍再打包。
      - name: 单测（JS 视图 + Rust）
        run: |
          npm run test:js
          cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}

      # DMG 自己打：tauri 自带的 dmg 目标要靠 AppleScript 指挥 Finder 摆图标，
      # 没有「自动化」授权就会失败，并且把已经打好的 .app 一起判成打包失败。
      - name: 生成 DMG（macOS）
        if: startsWith(matrix.os, 'macos')
        run: ./scripts/make-dmg.sh

      # .app 是单独上传的 artifact（不只 DMG 里有），所以这里再签一次。
      # tauri.conf.json 的 signingIdentity="-" 已经在 tauri build 阶段签过，
      # 但交叉编译那条路不一定走到那一步——漏掉的话，从浏览器下载后
      # Gatekeeper 会报「应用已损坏」而不是「无法验证开发者」。
      # sign-app.sh 幂等，多跑一次没有副作用；verify 不过就中止，不发包。
      - name: 签名校验（macOS）
        if: startsWith(matrix.os, 'macos')
        run: ./scripts/sign-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bambu-bar-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
          if-no-files-found: ignore
