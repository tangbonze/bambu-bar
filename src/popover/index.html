<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Bambu Bar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- tabindex="-1"：让面板本身可以接收焦点，用作「初始焦点」的落脚点。
       没有它，Chromium 会把打开窗口后的初始焦点丢给第一个可聚焦元素（右上刷新按钮），
       于是没人点过的按钮上就亮起一圈系统焦点环。 -->
  <div class="panel" id="panel" tabindex="-1">
    <header class="head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="18" height="18">
            <path d="M10 1.6v3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M6.4 4.8h7.2l-3.6 5.6z" fill="currentColor" />
            <rect x="3.2" y="12.4" width="13.6" height="1.7" rx="0.85" fill="currentColor" opacity=".9" />
            <rect x="5.4" y="15.2" width="9.2" height="1.7" rx="0.85" fill="currentColor" opacity=".55" />
          </svg>
        </span>
        <div class="brand-text">
          <div class="brand-name" id="brandName">Bambu Bar</div>
          <div class="brand-sum" id="summary">—</div>
        </div>
      </div>
      <div class="head-actions">
        <span class="demo-badge" id="demoBadge" hidden></span>
        <button class="icon-btn" id="btnRefresh" title="refresh">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path d="M13.6 8a5.6 5.6 0 1 1-1.7-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <path d="M13.8 1.6v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <!-- 这里只留刷新。设置入口在页脚「设置…」，右上不再放齿轮图标：
             那个位置容易被读成「明暗切换」，而且页脚已经有同一个入口。 -->
      </div>
    </header>

    <div class="list" id="list"></div>

    <footer class="foot">
      <!-- 这里曾有「更新于 2 秒钟前」的相对计时，已移除：
           打印机每推一帧报文它就归零重算，空闲机约 5 秒一帧，于是那个数字
           在 1~5 秒之间循环跳动，看起来像「面板每 5 秒刷新一次」。
           实际刷新节奏由打印机自己的上报频率决定（打印中约 1 秒、空闲约 5 秒），
           应用侧只在收到报文时重绘；显示一个会跳的秒数没有信息量，只有误解。 -->
      <span class="foot-actions">
        <button class="link-btn" id="btnSettings2">设置…</button>
        <span class="sep">·</span>
        <button class="link-btn" id="btnQuit">退出</button>
      </span>
    </footer>
  </div>
  <script src="popover.js"></script>
</body>
</html>
